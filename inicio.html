<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte TI - Iniciar Sesión</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            overflow: hidden;
            position: relative;
        }

        /* Elementos de luces neón animadas en el fondo */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .glow-1 {
            width: 300px;
            height: 300px;
            background: #6366f1;
            top: 10%;
            left: 15%;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: #a855f7;
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Tarjeta principal estilo Glassmorphism */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            border-radius: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .brand-header h1 {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            transition: fill 0.3s ease;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper select {
            appearance: none;
            cursor: pointer;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .input-wrapper input:focus + svg {
            fill: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert-box {
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-color);
            color: #6ee7b7;
        }

        .demo-users-info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            text-align: center;
        }

        .demo-users-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .demo-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .badge:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/>
                </svg>
            </div>
            <h1>Sistema de Triaje IA</h1>
            <p>Plataforma de Clasificación de Tickets de Soporte</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario / Correo</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="ej. carlos.soporte" required>
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
            </div>

            <div class="input-group">
                <label for="role">Rol Operativo</label>
                <div class="input-wrapper">
                    <select id="role" required>
                        <option value="analista">Analista de Triaje (TI)</option>
                        <option value="admin">Administrador del Sistema</option>
                    </select>
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Ingresar al Sistema</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg>
            </button>
        </form>

        <div class="demo-users-info">
            <p>Usuarios de prueba (haz clic para autorrellenar):</p>
            <div class="demo-badges">
                <span class="badge" onclick="fillDemo('carlos.soporte', 'soporte123')">Carlos (Soporte)</span>
                <span class="badge" onclick="fillDemo('admin.ti', 'admin123')">Admin (TI)</span>
            </div>
        </div>
    </div>

    <script>
        // Simulador de Base de Datos JSON de Usuarios
        const USERS_DB = [
            {
                "username": "carlos.soporte",
                "password": "soporte123",
                "name": "Carlos Rodríguez",
                "role": "analista",
                "department": "Mesa de Ayuda TI"
            },
            {
                "username": "admin.ti",
                "password": "admin123",
                "name": "Dra. Sofía Mendoza",
                "role": "admin",
                "department": "Infraestructura & Operaciones"
            }
        ];

        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const roleInput = document.getElementById('role').value;

            // Validación contra la estructura de datos JSON
            const foundUser = USERS_DB.find(u => u.username === usernameInput && u.password === passwordInput);

            if (foundUser) {
                if (foundUser.role !== roleInput) {
                    showAlert(`⚠️ El rol seleccionado no coincide con tu perfil (${foundUser.department}).`, 'error');
                    return;
                }

                showAlert(`¡Bienvenido/a, ${foundUser.name}! Redirigiendo al sistema...`, 'success');
                
                // Almacena la sesión en localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    name: foundUser.name,
                    username: foundUser.username,
                    role: foundUser.role,
                    department: foundUser.department,
                    loginTime: new Date().toISOString()
                }));

                setTimeout(() => {
                    alert(`[SESIÓN INICIADA]\nAccediendo como: ${foundUser.name}\nRol: ${foundUser.role.toUpperCase()}`);
                }, 1200);

            } else {
                showAlert('❌ Credenciales inválidas. Revisa tu usuario y contraseña.', 'error');
            }
        });
    </script>
</body>
</html>
